name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install "pytest>=8,<9" "numpy>=1.26,<2.0" "sacrebleu>=2.5,<2.6"
      - name: Check shell launchers
        run: bash -n run_fleurs.sh train_pdo.sh
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src scripts
