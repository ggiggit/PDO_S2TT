name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9" "numpy>=1.26,<2.0" "sacrebleu[ja]==2.6.0"
      - name: Install PDO_S2TT package
        run: python -m pip install -e . --no-deps
      - name: Check shell launchers
        run: bash -n scripts/run_fleurs.sh scripts/train_pdo.sh
      - name: Run unit tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src scripts
